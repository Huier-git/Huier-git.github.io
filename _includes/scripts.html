<script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
<script>window.jQuery || document.write('<script src="{{ site.url }}/assets/js/vendor/jquery-1.9.1.min.js"><\/script>')</script>
<script src="{{ site.url }}/assets/js/main.min.js"></script>

<script>
(function() {
  'use strict';

  /* ============================================================
     1. STICKY NAV — shrink on scroll
     ============================================================ */
  var nav = document.querySelector('.navigation-wrapper');
  if (nav) {
    window.addEventListener('scroll', function() {
      nav.classList.toggle('scrolled', window.scrollY > 40);
    }, { passive: true });
  }

  /* ============================================================
     2. SCROLL-TRIGGERED REVEAL
     ============================================================ */
  var revealTargets = document.querySelectorAll(
    '.article-wrap h1, .article-wrap h2, .article-wrap h4, ' +
    '.article-wrap center, .article-wrap blockquote, .article-wrap hr, ' +
    '.article-wrap ol, .article-wrap > p, .article-wrap > ul, ' +
    '.article-wrap .img-row, .article-wrap .stats-row, .article-wrap .contact-box'
  );

  revealTargets.forEach(function(el) { el.classList.add('reveal'); });

  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });
    revealTargets.forEach(function(el) { observer.observe(el); });
  } else {
    revealTargets.forEach(function(el) { el.classList.add('visible'); });
  }

  /* ============================================================
     3. READING PROGRESS BAR
     ============================================================ */
  var bar = document.createElement('div');
  bar.className = 'reading-progress';
  document.body.appendChild(bar);

  window.addEventListener('scroll', function() {
    var scrollTop = window.scrollY;
    var docHeight = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (docHeight > 0 ? (scrollTop / docHeight) * 100 : 0) + '%';
  }, { passive: true });

  /* ============================================================
     4. BACK TO TOP BUTTON
     ============================================================ */
  var btn = document.createElement('button');
  btn.className = 'back-to-top';
  btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>';
  btn.setAttribute('aria-label', 'Back to top');
  document.body.appendChild(btn);

  window.addEventListener('scroll', function() {
    btn.classList.toggle('show', window.scrollY > 400);
  }, { passive: true });

  btn.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* ============================================================
     5. CURSOR GLOW — subtle warm radial following mouse
     ============================================================ */
  if (window.innerWidth > 768) {
    var glow = document.createElement('div');
    glow.className = 'cursor-glow';
    document.body.appendChild(glow);

    var mouseX = -500, mouseY = -500;
    var glowX = -500, glowY = -500;

    document.addEventListener('mousemove', function(e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (!glow.classList.contains('active')) {
        glow.classList.add('active');
      }
    }, { passive: true });

    document.addEventListener('mouseleave', function() {
      glow.classList.remove('active');
    });

    function animateGlow() {
      glowX += (mouseX - glowX) * 0.1;
      glowY += (mouseY - glowY) * 0.1;
      glow.style.left = glowX + 'px';
      glow.style.top = glowY + 'px';
      requestAnimationFrame(animateGlow);
    }
    animateGlow();
  }

  /* ============================================================
     6. GEOMETRIC DECORATIONS — Complex SVG patterns
     ============================================================ */
  if (window.innerWidth > 900) {
    var c = '#c0825a';
    var svgNS = 'http://www.w3.org/2000/svg';

    function placeSVG(svg, top, left, right, bottom, opacity) {
      var wrap = document.createElement('div');
      wrap.style.cssText = 'position:fixed;pointer-events:none;z-index:0;opacity:' + opacity + ';';
      if (top) wrap.style.top = top;
      if (left) wrap.style.left = left;
      if (right) wrap.style.right = right;
      if (bottom) wrap.style.bottom = bottom;
      wrap.innerHTML = svg;
      document.body.appendChild(wrap);
    }

    /* ① Top-left: node network (connected dots) */
    placeSVG(
      '<svg width="90" height="90" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">' +
        '<circle cx="15" cy="15" r="3" fill="' + c + '"/>' +
        '<circle cx="45" cy="10" r="2.5" fill="' + c + '"/>' +
        '<circle cx="75" cy="20" r="3" fill="' + c + '"/>' +
        '<circle cx="30" cy="45" r="4" fill="' + c + '"/>' +
        '<circle cx="65" cy="50" r="2" fill="' + c + '"/>' +
        '<circle cx="20" cy="75" r="2.5" fill="' + c + '"/>' +
        '<circle cx="55" cy="80" r="3" fill="' + c + '"/>' +
        '<line x1="15" y1="15" x2="45" y2="10" stroke="' + c + '" stroke-width="1"/>' +
        '<line x1="45" y1="10" x2="75" y2="20" stroke="' + c + '" stroke-width="1"/>' +
        '<line x1="15" y1="15" x2="30" y2="45" stroke="' + c + '" stroke-width="1"/>' +
        '<line x1="45" y1="10" x2="30" y2="45" stroke="' + c + '" stroke-width="1"/>' +
        '<line x1="75" y1="20" x2="65" y2="50" stroke="' + c + '" stroke-width="1"/>' +
        '<line x1="30" y1="45" x2="65" y2="50" stroke="' + c + '" stroke-width="1"/>' +
        '<line x1="30" y1="45" x2="20" y2="75" stroke="' + c + '" stroke-width="1"/>' +
        '<line x1="65" y1="50" x2="55" y2="80" stroke="' + c + '" stroke-width="1"/>' +
        '<line x1="20" y1="75" x2="55" y2="80" stroke="' + c + '" stroke-width="1"/>' +
      '</svg>',
      '18%', '1.5%', null, null, 0.16
    );

    /* ② Right side: starburst / radial */
    placeSVG(
      '<svg width="70" height="70" viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg">' +
        '<circle cx="35" cy="35" r="3" fill="' + c + '"/>' +
        '<line x1="35" y1="35" x2="35" y2="5" stroke="' + c + '" stroke-width="1"/>' +
        '<line x1="35" y1="35" x2="56" y2="10" stroke="' + c + '" stroke-width="1"/>' +
        '<line x1="35" y1="35" x2="65" y2="25" stroke="' + c + '" stroke-width="1"/>' +
        '<line x1="35" y1="35" x2="65" y2="45" stroke="' + c + '" stroke-width="1"/>' +
        '<line x1="35" y1="35" x2="56" y2="60" stroke="' + c + '" stroke-width="1"/>' +
        '<line x1="35" y1="35" x2="35" y2="65" stroke="' + c + '" stroke-width="1"/>' +
        '<line x1="35" y1="35" x2="14" y2="60" stroke="' + c + '" stroke-width="1"/>' +
        '<line x1="35" y1="35" x2="5" y2="45" stroke="' + c + '" stroke-width="1"/>' +
        '<line x1="35" y1="35" x2="5" y2="25" stroke="' + c + '" stroke-width="1"/>' +
        '<line x1="35" y1="35" x2="14" y2="10" stroke="' + c + '" stroke-width="1"/>' +
        '<circle cx="35" cy="5" r="2" fill="' + c + '"/>' +
        '<circle cx="65" cy="25" r="2" fill="' + c + '"/>' +
        '<circle cx="65" cy="45" r="2" fill="' + c + '"/>' +
        '<circle cx="35" cy="65" r="2" fill="' + c + '"/>' +
        '<circle cx="5" cy="45" r="2" fill="' + c + '"/>' +
        '<circle cx="5" cy="25" r="2" fill="' + c + '"/>' +
      '</svg>',
      '42%', null, '1.5%', null, 0.13
    );

    /* ③ Left middle: concentric arcs */
    placeSVG(
      '<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">' +
        '<path d="M30 55 A25 25 0 0 1 5 30" stroke="' + c + '" stroke-width="1.5" fill="none"/>' +
        '<path d="M30 48 A18 18 0 0 1 12 30" stroke="' + c + '" stroke-width="1.5" fill="none"/>' +
        '<path d="M30 41 A11 11 0 0 1 19 30" stroke="' + c + '" stroke-width="1.5" fill="none"/>' +
        '<circle cx="30" cy="30" r="2" fill="' + c + '"/>' +
      '</svg>',
      '55%', '1.8%', null, null, 0.15
    );

    /* ④ Bottom-right: wavy fingerprint lines */
    placeSVG(
      '<svg width="65" height="50" viewBox="0 0 65 50" fill="none" xmlns="http://www.w3.org/2000/svg">' +
        '<path d="M5 10 Q20 5, 35 10 Q50 15, 60 10" stroke="' + c + '" stroke-width="1.2" fill="none"/>' +
        '<path d="M5 20 Q20 15, 35 20 Q50 25, 60 20" stroke="' + c + '" stroke-width="1.2" fill="none"/>' +
        '<path d="M5 30 Q20 25, 35 30 Q50 35, 60 30" stroke="' + c + '" stroke-width="1.2" fill="none"/>' +
        '<path d="M5 40 Q20 35, 35 40 Q50 45, 60 40" stroke="' + c + '" stroke-width="1.2" fill="none"/>' +
      '</svg>',
      null, null, '2%', '18%', 0.12
    );

    /* ⑤ Top-right area: clover / four-leaf */
    placeSVG(
      '<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">' +
        '<circle cx="20" cy="12" r="8" stroke="' + c + '" stroke-width="1.5" fill="none"/>' +
        '<circle cx="20" cy="28" r="8" stroke="' + c + '" stroke-width="1.5" fill="none"/>' +
        '<circle cx="12" cy="20" r="8" stroke="' + c + '" stroke-width="1.5" fill="none"/>' +
        '<circle cx="28" cy="20" r="8" stroke="' + c + '" stroke-width="1.5" fill="none"/>' +
        '<circle cx="20" cy="20" r="2" fill="' + c + '"/>' +
      '</svg>',
      '28%', null, '2.5%', null, 0.1
    );

    /* ⑥ Left bottom: three triangles */
    placeSVG(
      '<svg width="50" height="45" viewBox="0 0 50 45" fill="none" xmlns="http://www.w3.org/2000/svg">' +
        '<polygon points="25,5 5,40 45,40" stroke="' + c + '" stroke-width="1.5" fill="none"/>' +
        '<polygon points="25,15 12,35 38,35" stroke="' + c + '" stroke-width="1.2" fill="none"/>' +
        '<polygon points="25,23 18,32 32,32" stroke="' + c + '" stroke-width="1" fill="none"/>' +
      '</svg>',
      null, '2%', null, '35%', 0.13
    );

    /* ⑦ Mid-right: hourglass / bowtie */
    placeSVG(
      '<svg width="35" height="50" viewBox="0 0 35 50" fill="none" xmlns="http://www.w3.org/2000/svg">' +
        '<polygon points="5,5 30,5 17.5,25" stroke="' + c + '" stroke-width="1.5" fill="none"/>' +
        '<polygon points="5,45 30,45 17.5,25" stroke="' + c + '" stroke-width="1.5" fill="none"/>' +
        '<circle cx="17.5" cy="25" r="2.5" fill="' + c + '"/>' +
      '</svg>',
      '70%', null, '1.5%', null, 0.11
    );
  }

})();
</script>
