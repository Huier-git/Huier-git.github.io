<!doctype html>
<html class="no-js" lang="{% if page.lang %}{{ page.lang }}{% else %}en{% endif %}">

<head>
{% include head.html %}
</head>

<script>
(function(){var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();
</script>
<body class="page" itemscope itemtype="http://schema.org/WebPage">

{% include chrome-frame.html %}

<div class="page-shell">

  {% include navigation.html %}

  <div class="page-card">
    <aside class="sidebar" role="complementary">
      {% include author-bio.html %}
    </aside>

    <main id="main" role="main" itemprop="mainContentOfPage">
      <article itemscope itemtype="http://schema.org/CreativeWork">
        <div class="article-wrap" itemprop="text">
          {{ content }}
        </div>
      </article>
    </main>
  </div><!-- /.page-card -->

</div><!-- /.page-shell -->

<div class="footer-wrap">
  <footer>
    {% include footer.html %}
  </footer>
</div>

{% include scripts.html %}

</body>
</html>
